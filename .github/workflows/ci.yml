name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test with Xcode 26.6 / Swift 6.3
    # Keep the runner stable instead of following the moving macos-latest label.
    runs-on: macos-26
    timeout-minutes: 15
    # Xcode 26.6 provides the package's minimum supported Swift 6.3 toolchain.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test
